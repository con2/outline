name: cicd

on:
  push:
    branches:
      - con2

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}
      - uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.platform=linux/amd64
        env:
          TAG: ${{ github.sha }}

  deploy:
    runs-on: qb-arc-runners
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/con2' }}
    strategy:
      # One site failing must not stop the others, and con2.fi goes first on its own.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - site: con2
            namespace: outline
          - site: tracon
            namespace: outline-tracon
          - site: kuplii
            namespace: outline-kuplii
          - site: ropecon
            namespace: outline-ropecon
          - site: kotae
            namespace: outline-kotae
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: |
          helm upgrade --install outline chart \
            --namespace ${{ matrix.namespace }} \
            -f chart/values-${{ matrix.site }}.yaml \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 600s
